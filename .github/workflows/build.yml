name: Build Fast Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "=== PROJECT FILES ==="
          find . -maxdepth 5 -type f | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK and save log
        run: |
          echo "=== BUILD START ==="
          set +e
          gradle assembleDebug --stacktrace --info > build.log 2>&1
          BUILD_STATUS=$?
          echo "=== BUILD EXIT CODE: $BUILD_STATUS ===" >> build.log
          echo "=== LAST 200 LINES ==="
          tail -n 200 build.log
          exit $BUILD_STATUS

      - name: Show APK files
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Radio-APK
          path: "**/*.apk"
